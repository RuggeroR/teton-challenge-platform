<!doctype html>
<!--
  Teton phone configurator (SPEC §9.3, plan_v5 D3): the guided steps of SPEC §9.2 in Chrome
  on Android, over Web Bluetooth. The protocol is in protocol.js; this file only shows
  screens. Every text comes from teton_configurator/ui_text.py (the generated block below,
  review Q105).

  Serve from laptop 1:  python3 -m http.server 8000 --bind <laptop-ip> --directory web
  Phone: chrome://flags/#unsafely-treat-insecure-origin-as-secure -> http://<laptop-ip>:8000
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teton setup</title>
<style>
  :root { --fg: #111; --bg: #fff; --muted: #666; --line: #ddd; --accent: #1a5fb4; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #eee; --bg: #121212; --muted: #aaa; --line: #333; --accent: #78aeed; }
  }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: var(--bg);
         color: var(--fg); font-size: 1.05rem; line-height: 1.45; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  p { margin: 10px 0; }
  .note { color: var(--muted); font-size: 0.95rem; }
  button { display: block; width: 100%; font-size: 1.05rem; padding: 14px; margin: 10px 0;
           border-radius: 10px; border: 1px solid var(--accent); background: var(--accent);
           color: var(--bg); text-align: left; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.45; }
  label { display: block; margin-top: 12px; }
  input { width: 100%; box-sizing: border-box; font-size: 1.1rem; padding: 12px; margin-top: 6px;
          border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
          color: var(--fg); }
  .bars { font-family: monospace; float: right; }
</style>
</head>
<body>
<h1>Teton setup</h1>
<main id="app"></main>
<script type="module">
import {
  C, Client, ConnectionLostError, DeviceRefusedError, InvalidSetupCode, NoReplyError,
  RateLimitedError, WrongCodeError, decodeInfo, normalizeCode, setCredentials,
} from "./protocol.js";

// BEGIN GENERATED by tests/web_data.py: do not edit by hand
const T = {
  "PRESS_PAIRING_BUTTON": "Press the pairing button on the device. Its light starts blinking blue.",
  "NO_DEVICE_FOUND": "No device found. Press the pairing button on the device and try again.",
  "ASK_SETUP_CODE": "Setup code (printed on the device label): ",
  "CHECKING_CODE": "Checking the setup code...",
  "CODE_ACCEPTED": "Setup code accepted.",
  "LOOKING_FOR_NETWORKS": "The device is looking for Wi-Fi networks...",
  "ASK_PASSWORD": "Wi-Fi password: ",
  "SCAN_AGAIN": "Scan again",
  "RETRY_PASSWORD": "Try again (retype the password)",
  "PICK_ANOTHER_NETWORK": "Pick another network",
  "QUIT": "Quit",
  "WRONG_CODE": "The setup code is wrong, or this is not the right device. Check the code on the device label and type it again.",
  "NO_REPLY": "The device didn't answer. Press the pairing button on the device and try again.",
  "RESULT_TIMEOUT": "The device didn't report back in time. If its light is green it is connected; otherwise press the pairing button on the device and start again.",
  "CONNECTION_LOST": "The connection to the device was lost. Move closer, press the pairing button on the device and start again.",
  "UNEXPECTED_REPLY": "The device answered in a way this configurator doesn't understand. Update the configurator and start again.",
  "INVALID_CODE": "A setup code has 16 letters and digits, like 7K2M-QX9D-4HTR-B8WZ. Check the label and type it again.",
  "INVALID_PASSWORD_LENGTH": "A Wi-Fi password has 8 to 63 characters. Check it and type it again.",
  "PAGE_UNSUPPORTED": "This browser can't set up the device. Open this page in Chrome on an Android phone.",
  "PAGE_FIND_DEVICE": "Find the device",
  "PAGE_CONNECTING": "Connecting to the device...",
  "PAGE_CHECK_CODE": "Check the code",
  "PAGE_CONNECT": "Connect",
  "PAGE_START_OVER": "Start over",
  "PAGE_STOPPED": "Setup stopped. Tap Start over to begin again.",
  "PAGE_NO_NETWORKS": "The device found no networks it can join. Move it closer and scan again.",
  "PAGE_ENTERPRISE": "This page can't join enterprise networks. Pick another network, or use the laptop configurator.",
  "CONNECTING": "Connecting the device to {ssid}. This can take up to a minute...",
  "CONNECTED": {
    "full": "Connected. IP {ip}, internet OK.",
    "limited": "Connected. IP {ip}, internet not confirmed.",
    "none": "Connected. IP {ip}, internet not confirmed.",
    "unknown": "Connected. IP {ip}, internet not confirmed."
  },
  "FAILURES": {
    "wrong_password": "The Wi-Fi password was not accepted. Check it and try again.",
    "ssid_not_found": "The device can't see this network. Move closer or check the name.",
    "auth_failed": "The username or password was rejected by the network. Check them and try again.",
    "no_ip": "Connected to Wi-Fi but the network gave no address. Contact IT.",
    "captive_portal": "This network needs a login page; devices can't use it. Contact IT.",
    "no_internet": "Connected, but there is no internet access. Contact IT.",
    "timeout": "Connecting took too long. Try again."
  },
  "ERRORS": {
    "bad_request": "The device refused the request. Start again, and if it happens again contact support.",
    "unsupported_security": "The device can't join this type of network. Pick another network or contact IT.",
    "rate_limited": "Too many attempts with a wrong setup code. Wait {seconds}, then type the code again."
  },
  "WARNINGS": {
    "server_not_verified": "Warning: the device couldn't check that this is the real network, because no certificate file or server domain was given. Ask IT for them to make the setup safer.",
    "limited_internet": "Warning: the device joined the network but can't reach the internet. This may be normal on restricted networks; contact IT if the device stays offline."
  },
  "SECURITY_LABELS": {
    "wpa2-psk": "password",
    "wpa3-sae": "password",
    "wpa2-eap-peap": "enterprise"
  },
  "BARS": "▂▄▆█"
};
// END GENERATED

const app = document.getElementById("app");
const fill = (template, values) => template.replace(/\{(\w+)\}/g, (_, k) => values[k]);
const seconds = (n) => (n === 1 ? "1 second" : `${n} seconds`); // as ui_text._seconds
const bars = (signal) => { // as ui_text.signal_bars
  const count = signal >= 75 ? 4 : signal >= 50 ? 3 : signal >= 25 ? 2 : 1;
  return T.BARS.slice(0, count).padEnd(T.BARS.length, " ");
};

// --- screens ----------------------------------------------------------------------------

function screen(...parts) {
  app.replaceChildren(...parts.filter(Boolean));
}

function para(text, cls) {
  if (!text) return null;
  const p = document.createElement("p");
  p.textContent = text;
  if (cls) p.className = cls;
  return p;
}

function button(text, onClick, { secondary = false, disabled = false } = {}) {
  const b = document.createElement("button");
  b.textContent = text;
  if (secondary) b.className = "secondary";
  b.disabled = disabled;
  b.onclick = () => {
    for (const other of app.querySelectorAll("button")) other.disabled = true; // one step at a time
    onClick();
  };
  return b;
}

function field(labelText, type) {
  const label = document.createElement("label");
  label.textContent = labelText.replace(/:\s*$/, "");
  const input = document.createElement("input");
  input.type = type;
  input.autocomplete = "off";
  input.autocapitalize = "characters";
  input.spellcheck = false;
  label.appendChild(input);
  return { label, input };
}

// --- the link: Web Bluetooth -----------------------------------------------------------

let device = null;
let client = null;
let info = null;
let finished = false;

async function openLink(chosen) {
  const server = await chosen.gatt.connect();
  const service = await server.getPrimaryService(C.SERVICE_UUID);
  const ch = {};
  for (const [name, uuid] of Object.entries(C.CHANNEL_UUIDS)) {
    ch[name] = await service.getCharacteristic(uuid);
  }
  // Writes with response, one at a time, so chunks arrive in order (review Q98).
  client = new Client((channel, chunk) => ch[channel].writeValueWithResponse(chunk));
  // Subscribe before anything is written, so no reply can be missed (review Q95).
  for (const name of ["session", "status"]) {
    ch[name].addEventListener("characteristicvaluechanged", (e) => {
      const v = e.target.value;
      client.onChunk(name, new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength)));
    });
    await ch[name].startNotifications();
  }
  const value = await ch.info.readValue();
  info = decodeInfo(new Uint8Array(value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength)));
}

function textFor(error) {
  if (error instanceof NoReplyError) return T.NO_REPLY;
  if (error instanceof ConnectionLostError) return T.CONNECTION_LOST;
  return T.UNEXPECTED_REPLY; // ProtocolError, or anything we didn't expect
}

/** The run is over: one sentence and Start over (SPEC §9.2: the technician starts again). */
function end(text) {
  if (finished) return; // e.g. a disconnect while a step was already failing
  finished = true;
  if (device?.gatt.connected) device.gatt.disconnect();
  screen(para(text), button(T.PAGE_START_OVER, () => location.reload()));
}

// --- step 1: find the device (review Q104) ----------------------------------------------

function stepFind(message) {
  screen(para(message), para(T.PRESS_PAIRING_BUTTON), button(T.PAGE_FIND_DEVICE, findDevice));
}

async function findDevice() {
  try {
    // Chrome's own picker, filtered by our service: only advertising Teton devices appear.
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [C.SERVICE_UUID] }] });
  } catch {
    return stepFind(T.NO_DEVICE_FOUND); // nothing picked, or nothing found
  }
  device.addEventListener("gattserverdisconnected", () => {
    client?.lost(); // a waiting step fails at once (review Q110)
    end(T.CONNECTION_LOST);
  });
  screen(para(T.PAGE_CONNECTING));
  try {
    await openLink(device);
  } catch (e) {
    return end(e instanceof Error && e.name === "NetworkError" ? T.CONNECTION_LOST : textFor(e));
  }
  stepCode();
}

// --- step 2: the setup code (review Q40) ------------------------------------------------

function stepCode(message) {
  const { label, input } = field(T.ASK_SETUP_CODE, "text");
  screen(para(message), label, button(T.PAGE_CHECK_CODE, () => checkCode(input.value)));
  input.focus();
}

async function checkCode(typed) {
  let code;
  try {
    code = normalizeCode(typed);
  } catch (e) {
    if (e instanceof InvalidSetupCode) return stepCode(T.INVALID_CODE); // nothing sent (Q28)
    throw e;
  }
  screen(para(T.CHECKING_CODE));
  try {
    await client.handshake(code, info);
  } catch (e) {
    if (e instanceof WrongCodeError) return stepCode(T.WRONG_CODE);
    if (e instanceof RateLimitedError) {
      return stepCode(fill(T.ERRORS.rate_limited, { seconds: seconds(e.retryAfterS) }));
    }
    return end(textFor(e));
  }
  scanNetworks(T.CODE_ACCEPTED);
}

// --- step 3: the network (review Q103) --------------------------------------------------

let networks = [];

async function scanNetworks(message) {
  screen(para(message), para(T.LOOKING_FOR_NETWORKS));
  try {
    networks = await client.scan();
  } catch (e) {
    return end(textFor(e));
  }
  stepNetwork(message);
}

function stepNetwork(message) {
  const items = networks.map((net) => {
    const enterprise = net.security === "wpa2-eap-peap"; // not on the page (review Q103)
    const b = button(`${net.ssid}  ·  ${T.SECURITY_LABELS[net.security]}`,
      () => stepPassword(net), { disabled: enterprise, secondary: enterprise });
    const signal = document.createElement("span");
    signal.className = "bars";
    signal.textContent = bars(net.signal);
    b.appendChild(signal);
    return b;
  });
  const anyEnterprise = networks.some((n) => n.security === "wpa2-eap-peap");
  screen(
    para(message),
    para(networks.length ? null : T.PAGE_NO_NETWORKS),
    ...items,
    anyEnterprise ? para(T.PAGE_ENTERPRISE, "note") : null,
    button(T.SCAN_AGAIN, () => scanNetworks(), { secondary: true }),
  );
}

// --- steps 4 to 6: the password, progress and result (review Q44, Q47) ------------------

function stepPassword(net, message) {
  const { label, input } = field(T.ASK_PASSWORD, "password");
  input.autocapitalize = "none";
  screen(para(message), para(net.ssid), label,
    button(T.PAGE_CONNECT, () => {
      const psk = input.value;
      input.value = ""; // keep no copy on the screen
      connect(net, psk);
    }));
  input.focus();
}

async function connect(net, psk) {
  const length = [...psk].length;
  if (length < C.PSK_MIN_CHARS || length > C.PSK_MAX_CHARS) {
    return stepPassword(net, T.INVALID_PASSWORD_LENGTH); // nothing sent (Q28)
  }
  let result = null;
  try {
    for await (const status of client.provision(setCredentials(net.ssid, net.security, psk))) {
      if (status.state === "connecting") screen(para(fill(T.CONNECTING, { ssid: net.ssid })));
      else result = status;
    }
  } catch (e) {
    if (e instanceof DeviceRefusedError) return stepNetwork(T.ERRORS[e.code]);
    // Not "took too long": the device always finishes and may have connected.
    if (e instanceof NoReplyError) return end(T.RESULT_TIMEOUT);
    return end(textFor(e));
  }
  if (result.state === "connected") {
    finished = true; // the device ends the session; leaving now is not a lost connection
    const lines = [fill(T.CONNECTED[result.internet], { ip: result.ip })];
    for (const w of result.warnings) lines.push(T.WARNINGS[w]);
    if (device.gatt.connected) device.gatt.disconnect();
    return screen(...lines.map((l) => para(l)));
  }
  screen(
    para(T.FAILURES[result.reason]),
    button(T.RETRY_PASSWORD, () => stepPassword(net)),
    button(T.PICK_ANOTHER_NETWORK, () => stepNetwork(), { secondary: true }),
    button(T.QUIT, () => end(T.PAGE_STOPPED), { secondary: true }),
  );
}

// --- start ------------------------------------------------------------------------------

async function supported() {
  if (!window.isSecureContext || !navigator.bluetooth || !globalThis.crypto?.subtle) return false;
  try {
    await crypto.subtle.generateKey({ name: "X25519" }, false, ["deriveBits"]);
    return true;
  } catch {
    return false; // no X25519 in WebCrypto (review Q107)
  }
}

if (await supported()) stepFind();
else screen(para(T.PAGE_UNSUPPORTED));
</script>
</body>
</html>
